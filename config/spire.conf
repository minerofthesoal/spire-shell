# spire configuration
#
# This file is plain `key = value` lines. Lines starting with # are
# comments. Quotes around a value are optional but let you keep
# leading/trailing spaces.

# ---- prompt -----------------------------------------------------------
# %n user   %m host   %~ cwd (~ shortened)   %d full cwd   %g git branch
# %F{color}...%f colored span   %#  '#' for root else '$'   %% literal %
prompt = "%F{cyan}%n%f@%F{cyan}%m%f %F{yellow}%~%f %F{brightblack}%g%f %F{green}▲❯%f "

# ---- syntax highlighting colors ---------------------------------------
# any of: black red green yellow blue magenta cyan white default
# brightblack brightred brightgreen brightyellow brightblue brightmagenta
# brightcyan brightwhite, "bold-<name>", or a raw 256-color number.
color.command         = green
color.command_invalid = red
color.builtin         = blue
color.string          = yellow
color.variable        = cyan
color.operator        = magenta
color.comment         = brightblack
color.keyword         = blue
color.number          = magenta
color.path            = white
color.array           = brightmagenta
color.suggestion      = brightblack
color.text            = default

# ---- history ------------------------------------------------------------
history.size = 5000

# ---- modules --------------------------------------------------------
# comma-separated list of modules to source at startup from
# ~/.config/spire/modules/<name>.spire. Two starter modules ship with
# spire: "aliases" (ll, .., gs, ...) and "git" (gbranch, gclean, gundo).
modules = aliases, git
